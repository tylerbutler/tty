name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  # The pinned setup-beam action does not support Ubuntu 26.04.
  # Target-independent checks: run once, not per version.
  checks:
    runs-on: ubuntu-24.04
    name: Checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Setup Trellis
        uses: tylerbutler/actions/setup-trellis@40269ed66210884257a06ab9c0f7e2c4f987af05 # ratchet:tylerbutler/actions/setup-trellis@main
        with:
          version: "1.3.0"

      - name: Check release configuration
        run: just release-check

      - name: Lint (formatting + glinter)
        run: just lint

      - name: Type check
        run: just check

      - name: Build documentation
        run: just docs

  # Erlang target: sweep OTP across the supported range (claim: OTP >= 26).
  # Node is irrelevant to this target, so it is not installed here.
  test-erlang:
    runs-on: ubuntu-24.04
    name: Test Erlang (OTP ${{ matrix.otp }})
    strategy:
      fail-fast: false
      matrix:
        otp: ["26", "27", "28"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          otp-version: ${{ matrix.otp }}
          gleam-version: "1.16.0"

      - name: Build (warnings as errors)
        run: gleam build --target erlang --warnings-as-errors

      - name: Run tests
        run: gleam test --target erlang

  # JavaScript target: sweep Node across the supported range (claim: Node >= 20).
  # A fixed OTP only hosts the Gleam compiler; it does not affect JS output.
  test-javascript:
    runs-on: ubuntu-24.04
    name: Test JavaScript (Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          otp-version: "27"
          gleam-version: "1.16.0"
          node: "true"
          node-version: ${{ matrix.node }}

      - name: Build (warnings as errors)
        run: gleam build --target javascript --warnings-as-errors

      - name: Run tests
        run: gleam test --target javascript
